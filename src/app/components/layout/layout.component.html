<div class="flex items-start gap-2 min-w-0">
    <div class="flex-1 min-w-0 flex flex-col gap-1.5">
        <div class="overflow-x-auto">
            <div class="flex flex-col gap-1.5 w-max min-w-full">
                @for (row of rows(); track $index) {
                    <div class="flex gap-1.5">
                        @for (key of row; track key.position) {
                            <button type="button"
                                    class="flex-1 aspect-square min-w-9 flex flex-col items-center justify-center gap-0.5 font-body font-medium text-sm uppercase rounded-sm cursor-pointer disabled:cursor-default disabled:hover:text-text disabled:hover:border-divider disabled:active:bg-transparent"
                                    [class]="key.secondaryHighlighted ? 'text-warning border border-warning/60 bg-warning/14' : key.highlighted ? 'text-accent border border-accent/60 bg-accent/14' : 'text-text bg-surface border border-divider hover:text-accent hover:border-accent active:bg-accent/18'"
                                    (click)="onKeyClickOpenDialog(key)"
                                    [disabled]="isDisabled()"
                            >
                                <span>{{ key.label }}</span>
                                <span class="text-xs text-text/40">{{ key.position }}</span>
                            </button>
                        }
                    </div>
                }
            </div>
        </div>
        @if (canResize() && !isDisabled()) {
            <div class="flex gap-1.5">
                <app-custom-button type="button" variant="ghost" (click)="addRow()">+ Add row</app-custom-button>
                <app-custom-button type="button" variant="ghost" (click)="removeRow()">- Remove row</app-custom-button>
            </div>
        }
    </div>
    @if (canResize() && !isDisabled()) {
        <div class="flex flex-col gap-1.5 shrink-0">
            <app-custom-button type="button" variant="ghost" (click)="addColumn()">+ Add column</app-custom-button>
            <app-custom-button type="button" variant="ghost" (click)="removeColumn()">- Remove column</app-custom-button>
        </div>
    }
</div>
