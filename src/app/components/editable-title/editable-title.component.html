@if (isEditing()) {
    <input
        #input
        class="min-h-9 py-1.5 px-2.5 text-2xl font-medium text-text caret-accent bg-surface border border-divider rounded-md"
        [value]="value()"
        (input)="value.set($any($event.target).value)"
        (blur)="stopEdit()"
        (keydown.enter)="stopEdit()"
    />
} @else {
    <h1
        tabindex="0"
        class="m-0 text-2xl font-medium cursor-text select-none px-2.5 py-1.5 rounded-md hover:bg-text/5"
        (dblclick)="edit()"
    >{{ value() || 'Untitled' }}</h1>
}
