<div
    #trigger
    class="flex items-center justify-between gap-2 h-9 px-3 rounded-md border border-accent bg-accent/5 text-accent text-sm cursor-pointer select-none hover:bg-accent/12"
    [class.opacity-40]="disabled()"
    [class.cursor-not-allowed]="disabled()"
    [class.pointer-events-none]="disabled()"
    tabindex="0"
    (click)="toggle()"
>
    <span class="truncate">{{ displayValue() }}</span>
    <span [class.rotate-180]="popupExpanded()">▾</span>
</div>
<ng-template
    [cdkConnectedOverlay]="{origin: trigger, usePopover: 'inline', matchWidth: true}"
    [cdkConnectedOverlayOpen]="popupExpanded()"
    (overlayOutsideClick)="popupExpanded.set(false)"
>
    <div class="mt-2 w-full rounded-md bg-surface p-2 shadow-lg">
        <input #searchEl type="text" placeholder="Search…"
               class="w-full min-h-8 mb-2 px-2.5 text-sm text-text bg-surface border border-divider rounded-md"
               [value]="searchTerm()"
               (input)="onSearchInput($any($event.target).value)"
               (keydown.escape)="close()"
               (keydown.enter)="selectHighlighted()"
               (keydown.arrowdown)="$event.preventDefault(); moveHighlight(1)"
               (keydown.arrowup)="$event.preventDefault(); moveHighlight(-1)"/>
        <div class="flex flex-col gap-0.5 max-h-44 overflow-auto">
            @for (label of filteredLabels(); track label; let i = $index) {
                <div #itemEl
                    class="flex items-center justify-between gap-2 min-h-9 px-3 rounded-md cursor-pointer hover:bg-text/5"
                    [class]="itemClass(i, label)"
                    (click)="select(label)"
                    (mouseenter)="highlightedIndex.set(i)"
                >
                    <span class="truncate">{{ label }}</span>
                    @if (label === value()) {
                        <span>✓</span>
                    }
                </div>
            } @empty {
                <div class="px-3 py-2 text-sm text-text/50">No match</div>
            }
        </div>
    </div>
</ng-template>
