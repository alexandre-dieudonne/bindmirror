<div class="flex flex-col items-center gap-3 min-w-50 p-8 bg-surface border rounded-2xl shadow-lg"
     [class]="dialogClasses()">
    <div class="text-lg text-text text-center">
        {{ data.message }}
    </div>
    <div class="mt-1 flex items-center gap-2">
        <app-custom-button
            type="button"
            (click)="dialogRef.close()">Cancel
        </app-custom-button>
        <app-custom-button
            [variant]="variant()"
            type="button"
            (click)="onConfirm()">{{ data.confirmLabel ?? 'Delete' }}
        </app-custom-button>
    </div>
</div>
