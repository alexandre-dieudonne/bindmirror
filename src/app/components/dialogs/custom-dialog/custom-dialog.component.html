<div class="flex flex-col items-center gap-3 min-w-50 p-8 bg-surface border rounded-2xl shadow-lg"
     [class]="dialogClasses()">
    <div
        class="text-3xl text-text rounded-sm">
        {{ data.message }}
    </div>
    <div class="mt-1">
        <app-custom-button
            [variant]="variant()"
            type="button"
            (click)="dialogRef.close()">Close
        </app-custom-button>
    </div>
</div>
