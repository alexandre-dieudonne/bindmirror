<div class="box-content max-w-6xl mx-auto px-4 sm:px-8 lg:px-12 pt-7 pb-18 flex flex-col gap-5">
    <div class="flex items-center gap-3 flex-wrap">
        <app-back-button backUrl="/my-keymaps"></app-back-button>
        <app-editable-title [(value)]="currentName"/>
        <span class="flex-1"></span>
        <app-toggle-button [(value)]="multi">Multi</app-toggle-button>
        <app-export-button
            [localStorageKey]="APP_CONSTANTS.keymaps"
            [localStorageValues]="exportData()"
            [name]="currentName()">
            Export
        </app-export-button>
        <app-custom-button type="button" (click)="onSave()">Save</app-custom-button>
    </div>
    @if (!isEditMode()) {
        <div class="flex items-center gap-3 p-3.5 rounded-2xl bg-surface shadow-sm">
            <app-import-button
                localStorageKey="{{ APP_CONSTANTS.keymaps }}"
                (imported)="onImported($event)">
                Import
            </app-import-button>
        </div>
    }

    <app-keymap [(keymap)]="currentKeymap" [multi]="multi()"/>
</div>
