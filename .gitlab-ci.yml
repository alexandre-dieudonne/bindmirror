image: node:24-alpine

cache:
  key:
    files:
      - package-lock.json
  paths:
    - node_modules/

stages:
  - test
  - build

test:
  stage: test
  script:
    - npm ci
    - npm run format:check
    - npx ng test --watch=false

build:
  stage: build
  script:
    - npm ci
    - npm run build
