image: node:24-alpine

cache:
  key:
    files:
      - package-lock.json
  paths:
    - node_modules/

stages:
  - test
  - build
  - deploy

test:
  stage: test
  script:
    - npm ci
    - npm run format:check
    - npx ng test --watch=false

build:
  stage: build
  script:
    - npm ci
    - npm run build

pages:
  stage: deploy
  script:
    - npm ci
    - npm run build
    - rm -rf public
    - mv dist/bindmirror/browser public
    - cp public/index.html public/404.html
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
